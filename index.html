<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Homepage</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #e8f4fd 0%, #dbeafe 40%, #c7d9f0 100%);
            min-height: 100vh;
            color: #334155;
            padding: 20px
        }

        .container {
            max-width: 1500px;
            margin: 0 auto
        }

        header {
            text-align: center;
            padding: 24px 0 16px;
            border-bottom: 1px solid rgba(59, 130, 246, .12);
            margin-bottom: 12px
        }

        header h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(90deg, #2563eb, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px
        }

        header p {
            color: #64748b;
            font-size: .85rem
        }

        .search-bar {
            display: flex;
            justify-content: center;
            margin: 12px 0 16px;
            flex-wrap: wrap
        }

        .search-wrap {
            position: relative;
            width: min(500px, 80vw)
        }

        .search-wrap input {
            width: 100%;
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid #bfdbfe;
            background: rgba(255, 255, 255, .85);
            color: #334155;
            font-size: .95rem;
            outline: none;
            transition: border .2s
        }

        .search-wrap input:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, .1)
        }

        .search-wrap input::placeholder {
            color: #94a3b8
        }

        .search-clear {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: none;
            background: #e2e8f0;
            color: #64748b;
            font-size: 1rem;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            line-height: 1;
            transition: all .15s
        }

        .search-clear:hover {
            background: #94a3b8;
            color: #fff
        }

        .search-clear.show {
            display: flex
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 16px;
            flex-wrap: wrap
        }

        .tab {
            padding: 10px 28px;
            border-radius: 10px;
            border: 1px solid #bfdbfe;
            background: rgba(255, 255, 255, .6);
            color: #64748b;
            cursor: pointer;
            font-size: .9rem;
            font-weight: 500;
            transition: all .2s;
            user-select: none
        }

        .tab:hover {
            background: rgba(255, 255, 255, .9);
            color: #3b82f6
        }

        .tab.active {
            background: linear-gradient(135deg, #3b82f6, #7c3aed);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(59, 130, 246, .25)
        }

        .tab .count {
            font-size: .72rem;
            margin-left: 4px;
            opacity: .7;
            font-weight: 400
        }

        .results-info {
            text-align: center;
            color: #94a3b8;
            font-size: .8rem;
            margin-bottom: 10px
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 14px
        }

        .card {
            background: rgba(255, 255, 255, .75);
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 14px 18px;
            transition: all .2s;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .04)
        }

        .card:hover {
            background: rgba(255, 255, 255, .95);
            border-color: #93c5fd;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, .1)
        }

        .card-title {
            font-size: .9rem;
            color: #1e40af;
            text-decoration: none;
            line-height: 1.5;
            display: block
        }

        .card-title:hover {
            color: #7c3aed
        }

        .card-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap
        }

        .card-date {
            font-size: .72rem;
            color: #94a3b8
        }

        .card-desc {
            font-size: .78rem;
            color: #64748b;
            line-height: 1.4
        }

        .badge {
            font-size: .65rem;
            padding: 2px 8px;
            border-radius: 4px;
            display: inline-block;
            font-weight: 500
        }

        .b-blue {
            background: #dbeafe;
            color: #2563eb
        }

        .b-deep {
            background: #ede9fe;
            color: #6d28d9
        }

        .b-dark {
            background: #fee2e2;
            color: #dc2626
        }

        .b-warm {
            background: #fef3c7;
            color: #d97706
        }

        .b-academic {
            background: #f3e8ff;
            color: #7c3aed
        }

        .b-bamboo {
            background: #dcfce7;
            color: #16a34a
        }

        .b-water {
            background: #e0f2fe;
            color: #0284c7
        }

        .b-clean {
            background: #f1f5f9;
            color: #64748b
        }

        .b-business {
            background: #fff7ed;
            color: #ea580c
        }

        .b-github {
            background: #fefce8;
            color: #a16207
        }

        .b-classical {
            background: #f1f5f9;
            color: #64748b
        }

        .b-art {
            background: #fce7f3;
            color: #db2777
        }

        .b-mint {
            background: #ccfbf1;
            color: #0d9488
        }

        .b-purple {
            background: #f3e8ff;
            color: #7c3aed
        }

        .b-lavender {
            background: #ede9fe;
            color: #8b5cf6
        }

        .b-暗黑 {
            background: #fee2e2;
            color: #dc2626
        }

        .b-水墨 {
            background: #e0f2fe;
            color: #0284c7
        }

        .b-project {
            background: #cffafe;
            color: #0891b2
        }

        .b-topic {
            background: #ede9fe;
            color: #7c3aed
        }

        .b-light {
            background: #f8fafc;
            color: #475569
        }

        .b-technical-blue {
            background: #dbeafe;
            color: #2563eb
        }

        .b-ubot {
            background: #e0e7ff;
            color: #4338ca
        }

        .path {
            font-size: .68rem;
            color: #94a3b8;
            font-family: monospace;
            background: #f1f5f9;
            padding: 2px 8px;
            border-radius: 4px
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
            align-items: center
        }

        .pagination button {
            padding: 8px 18px;
            border-radius: 8px;
            border: 1px solid #bfdbfe;
            background: rgba(255, 255, 255, .7);
            color: #3b82f6;
            cursor: pointer;
            font-size: .85rem;
            transition: all .2s
        }

        .pagination button:hover {
            background: #3b82f6;
            color: #fff
        }

        .pagination button:disabled {
            opacity: .3;
            cursor: default;
            background: rgba(255, 255, 255, .5)
        }

        .pagination span {
            color: #94a3b8;
            font-size: .8rem
        }

        .path {
            font-size: .68rem;
            color: #94a3b8;
            font-family: monospace;
            background: #f1f5f9;
            padding: 2px 8px;
            border-radius: 4px
        }

        .empty {
            text-align: center;
            padding: 50px 20px;
            color: #94a3b8;
            font-size: .95rem
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            padding: 14px;
            color: #94a3b8;
            font-size: .75rem;
            border-top: 1px solid #e2e8f0
        }

        mark {
            background: #c4b5fd;
            color: #1e1b4b;
            border-radius: 2px;
            padding: 0 2px
        }

        @media(max-width:768px) {
            .grid {
                grid-template-columns: 1fr
            }

            header h1 {
                font-size: 1.4rem
            }

            .stats-bar {
                gap: 18px
            }

            .search-wrap{width:95vw}

            .tab {
                padding: 8px 16px;
                font-size: .82rem
            }
        }
        .copy-btn, .share-btn { cursor:pointer; opacity:0; transition:opacity .2s; background:none; border:none; font-size:.85em; padding:2px 6px; border-radius:4px; color:inherit; }
        .card:hover .copy-btn, .card:hover .share-btn { opacity:.5; }
        .copy-btn:hover, .share-btn:hover { opacity:1!important; background:rgba(128,128,128,.12); }
        .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:8px 20px; border-radius:8px; font-size:.85em; opacity:0; transition:opacity .3s; z-index:9999; pointer-events:none; }
        .toast.show { opacity:1; }
    </style>
</head>

<body>
    <div class="container">
        <header id="pageHeader">
            <p>个人知识库 · 项目中心 · 快速导航</p>
        </header>
        <script>if(location.hostname==='hpage.top')document.getElementById('pageHeader').style.display='none';</script>

        <div class="search-bar">
            <div class="search-wrap">
                <input type="text" id="searchInput" placeholder="🔍 搜索笔记、项目、Topic..." autofocus oninput="onSearchInput()">
                <button class="search-clear" id="searchClear" onclick="clearSearch()">✕</button>
            </div>
        </div>

        <div class="tabs" id="tabBar"></div>
        <div class="results-info" id="resultsInfo"></div>
        <div class="grid" id="cardGrid"></div>
        <div class="pagination" id="pagination"></div>

        <div class="footer" id="footer"></div>
    </div>

    <script>
        const PAGE_SIZE = 30;
        let DATA = null;
        let filtered = [];
        let page = 1;
        let activeTab = 'notes'; // default tab
        const IS_PUBLIC = (window.location.hostname === 'hpage.top');

        const THEME_CLASS = {
            'tech-blue': 'b-blue', 'dark': 'b-dark', 'warm': 'b-warm', 'academic': 'b-academic',
            'bamboo': 'b-bamboo', '水墨': 'b-water', 'clean': 'b-clean', 'business': 'b-business',
            'github': 'b-github', 'classical': 'b-classical', 'art': 'b-art', 'mint': 'b-mint',
            'deep-blue': 'b-deep', 'deep-purple': 'b-purple', 'dark-blue': 'b-deep',
            'lavender': 'b-lavender', '暗黑': 'b-暗黑', 'light': 'b-light',
            'technical-blue': 'b-technical-blue',
        };

        function hl(text, q) {
            if (!q) return esc(text);
            return esc(text).replace(new RegExp('(' + escRe(q) + ')', 'gi'), '<mark>$1</mark>');
        }
        function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
        function escRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

        function buildCard(item) {
            const q = document.getElementById('searchInput').value.trim();
            const type = item._type;
            let badgeCls = THEME_CLASS[item.theme] || 'b-clean';

            if (type === 'note') {
                const fileRef = item.path || item.file;
                const rawHref = '../bookmarks/notes/' + fileRef;
                // Encoded version for sharing (WeChat etc.)
                const encodedHref = '../bookmarks/notes/' + fileRef.split('/').map(s => encodeURIComponent(s)).join('/');
                return `<a class="card-title" href="${rawHref}" target="_blank">${hl(item.title, q)}</a>
            <div class="card-meta">
                ${item.date ? `<span class="card-date">${item.date}</span>` : ''}
                ${item.theme ? `<span class="badge ${badgeCls}">${item.theme}</span>` : '<span class="badge b-blue">note</span>'}
                <button class="copy-btn" onclick="event.preventDefault();event.stopPropagation();copyUrl('${rawHref.replace(/'/g, "\\'")}')" title="复制链接">📋</button>
                <button class="share-btn" onclick="event.preventDefault();event.stopPropagation();shareNote('${rawHref.replace(/'/g, "\\'")}', '${(item.title || '').replace(/'/g, "\\'")}')" title="分享到微信">📤</button>
            </div>`;
            }
            if (type === 'project') {
                const href = '../project/' + encodeURIComponent(item.folder) + '/';
                return `<a class="card-title" href="${href}" target="_blank">${hl(item.name, q)}</a>
            <div class="card-meta">
                <span class="badge b-project">📁 项目</span>
                <span class="path">${item.folder}/</span>
            </div>
            ${item.desc ? `<div class="card-desc">${esc(item.desc)}</div>` : ''}`;
            }
            if (type === 'topic') {
                let href = '';
                if (item.path) {
                    if (item.path.startsWith('../') || item.path.startsWith('/')) href = item.path;
                    else href = '../bookmarks/notes/' + item.path;
                } else if (item.file) {
                    href = '../bookmarks/notes/' + item.file;
                }
                else if (item.folder) href = '../project/' + encodeURIComponent(item.folder) + '/';
                const statusBadge = item.status ? `<span class="badge ${item.status === 'active' ? 'b-bamboo' : 'b-clean'}">${item.status}</span>` : '';
                return `<a class="card-title" href="${href}" target="_blank">${hl(item.title, q)}</a>
            <div class="card-meta">
                ${item.date ? `<span class="card-date">${item.date}</span>` : ''}
                <span class="badge b-topic">🐱 jbot</span>
                ${statusBadge}
                ${item.folder ? `<span class="path">${item.folder}</span>` : ''}
                ${href ? `<button class="share-btn" onclick="event.preventDefault();event.stopPropagation();shareNote('${href.replace(/'/g, "\\'")}', '${(item.title || '').replace(/'/g, "\\'")}')" title="分享">📤</button>` : ''}
            </div>`;
            }
            if (type === 'ubot') {
                let href = '';
                if (item.path && item.path.includes('/uclaw/')) href = item.path.replace(/^.*\/uclaw\//, '../');
                else if (item.path && item.path.includes('/.hermes')) href = '';  // no access to .hermes
                else if (item.path) href = item.path;
                if (!href) {
                    const statusBadge = item.status ? `<span class="badge ${item.status === 'active' ? 'b-bamboo' : 'b-clean'}">${item.status}</span>` : '';
                    return `<div class="card-title" style="color:inherit;text-decoration:none">${hl(item.title, q)}</div>
                <div class="card-meta">
                    ${item.date ? `<span class="card-date">${item.date}</span>` : ''}
                    <span class="badge b-ubot">🤖 ubot</span>
                    ${statusBadge}
                    ${item.folder ? `<span class="path">${item.folder}</span>` : ''}
                </div>`;
                }
                const statusBadge = item.status ? `<span class="badge ${item.status === 'active' ? 'b-bamboo' : 'b-clean'}">${item.status}</span>` : '';
                return `<a class="card-title" href="${href}" target="_blank">${hl(item.title, q)}</a>
            <div class="card-meta">
                ${item.date ? `<span class="card-date">${item.date}</span>` : ''}
                <span class="badge b-ubot">🤖 ubot</span>
                ${statusBadge}
                ${item.folder ? `<span class="path">${item.folder}</span>` : ''}
            </div>`;
            }
            return '';
        }

        function render() {
            const grid = document.getElementById('cardGrid');
            const start = (page - 1) * PAGE_SIZE;
            const slice = filtered.slice(start, start + PAGE_SIZE);
            if (!slice.length) {
                grid.innerHTML = '<div class="empty">没有找到匹配的内容</div>';
            } else {
                grid.innerHTML = slice.map(i => '<div class="card">' + buildCard(i) + '</div>').join('');
            }
            const total = filtered.length;
            const info = document.getElementById('resultsInfo');
            info.textContent = total > PAGE_SIZE
                ? `显示 ${start + 1}-${Math.min(start + PAGE_SIZE, total)} / 共 ${total} 条`
                : total ? `共 ${total} 条` : '';

            const pg = document.getElementById('pagination');
            const pages = Math.ceil(total / PAGE_SIZE);
            if (pages <= 1) { pg.innerHTML = ''; return; }
            pg.innerHTML = `<button onclick="goPage(${page - 1})" ${page <= 1 ? 'disabled' : ''}>← 上一页</button>
        <span>${page} / ${pages}</span>
        <button onclick="goPage(${page + 1})" ${page >= pages ? 'disabled' : ''}>下一页 →</button>`;
        }

        function goPage(p) { page = p; render(); window.scrollTo({ top: 280, behavior: 'smooth' }); }

        function filter() {
            const q = document.getElementById('searchInput').value.trim().toLowerCase();
            let items = [];
            if (activeTab === 'topics') items = DATA.topics.slice();
            if (activeTab === 'projects') items = DATA.projects.slice();
            if (activeTab === 'notes') items = DATA.notes.slice();
            if (activeTab === 'ubot') items = (DATA.ubot_topics || []).slice();
            // Public mode: force notes only, ignore other tabs
            if (IS_PUBLIC && activeTab !== 'notes') { items = DATA.notes.slice(); activeTab = 'notes'; }
            if (q) {
                items = items.filter(i => {
                    const hay = [i.title, i.name, i.desc, i.theme, i.file, i.path, i.subdir]
                        .filter(Boolean).join(' ').toLowerCase();
                    return hay.includes(q);
                });
            }
            filtered = items;
            page = 1;
            render();
        }

        function setTab(tab) {
            activeTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
            filter();
        }

        function buildUI() {
            if (IS_PUBLIC) {
                // Public: hide header + tab bar, only notes
                document.getElementById('pageHeader').style.display = 'none';
                document.getElementById('tabBar').style.display = 'none';
            } else {
                // LAN: show all tabs
                document.getElementById('tabBar').innerHTML = `
        <div class="tab${activeTab === 'topics' ? ' active' : ''}" data-tab="topics" onclick="setTab('topics')">🐱 jbot<span class="count">${DATA.stats.topics}</span></div>
        <div class="tab${activeTab === 'ubot' ? ' active' : ''}" data-tab="ubot" onclick="setTab('ubot')">🤖 ubot<span class="count">${DATA.stats.ubot_topics || 0}</span></div>
        <div class="tab${activeTab === 'projects' ? ' active' : ''}" data-tab="projects" onclick="setTab('projects')">🚀 项目<span class="count">${DATA.stats.projects}</span></div>
        <div class="tab${activeTab === 'notes' ? ' active' : ''}" data-tab="notes" onclick="setTab('notes')">📝 笔记<span class="count">${DATA.stats.notes}</span></div>`;
            }

            const footer = document.getElementById('footer');
            if (IS_PUBLIC) {
                footer.innerHTML = `<p>更新于 ${DATA.updated}</p>`;
            } else {
                footer.innerHTML = `<p>📍 /home/jc/uclaw/ · 更新于 ${DATA.updated}</p>`;
            }
        }

        fetch('/data.json?t=' + Date.now())
            .then(r => r.json())
            .then(d => {
                DATA = d;
                // Sort notes by date desc, then mtime desc (newest first)
                DATA.notes.sort((a, b) => {
                    const d = (b.date || '').localeCompare(a.date || '');
                    return d !== 0 ? d : (b.mtime || 0) - (a.mtime || 0);
                });
                DATA.notes.forEach(i => i._type = 'note');
                DATA.projects.forEach(i => i._type = 'project');
                DATA.topics.forEach(i => i._type = 'topic');
                (DATA.ubot_topics || []).forEach(i => i._type = 'ubot');
                buildUI();
                filter();
            })
            .catch(e => {
                document.getElementById('cardGrid').innerHTML = '<div class="empty">❌ 加载 data.json 失败: ' + e.message + '</div>';
            });

        // Auto-poll data.json every 30s, silent refresh if changed
        let _lastUpdate = '';
        setTimeout(() => { if (DATA) _lastUpdate = DATA.updated || ''; }, 1000);
        setInterval(() => {
            fetch('/data.json?t=' + Date.now())
                .then(r => r.json())
                .then(d => {
                    const currentUpdate = _lastUpdate || (DATA ? DATA.updated : '');
                    if (d.updated && d.updated !== currentUpdate) {
                        _lastUpdate = d.updated;
                        DATA = d;
                        // Sort notes by date desc, then mtime desc (newest first)
                        DATA.notes.sort((a, b) => {
                            const d = (b.date || '').localeCompare(a.date || '');
                            return d !== 0 ? d : (b.mtime || 0) - (a.mtime || 0);
                        });
                        DATA.notes.forEach(i => i._type = 'note');
                        DATA.projects.forEach(i => i._type = 'project');
                        DATA.topics.forEach(i => i._type = 'topic');
                        (DATA.ubot_topics || []).forEach(i => i._type = 'ubot');
                        filter();
                    }
                })
                .catch(() => {});
        }, 30000);

        // 搜索相关 — 全局函数，不依赖闭包变量
        function _debounce() { clearTimeout(window._searchTimer); window._searchTimer = setTimeout(filter, 150); }
        function toggleClear() {
            var el = document.getElementById('searchInput');
            var btn = document.getElementById('searchClear');
            if (el.value.length > 0) btn.classList.add('show');
            else btn.classList.remove('show');
        }
        function clearSearch() {
            document.getElementById('searchInput').value = '';
            toggleClear();
            filter();
            document.getElementById('searchInput').focus();
        }
        function onSearchInput() {
            toggleClear();
            _debounce();
        }
        document.addEventListener('keydown', function(e) { if (e.key === 'Escape') clearSearch(); });
        toggleClear();

        // Share note: share URL only (WeChat auto-fetches preview with title)
        function shareNote(rawHref, title) {
            const a = document.createElement('a');
            a.href = rawHref;
            const fullUrl = a.href;
            // URL-encode the pathname for WeChat compatibility
            const urlObj = new URL(fullUrl);
            urlObj.pathname = urlObj.pathname.split('/').map(s => encodeURIComponent(decodeURIComponent(s))).join('/');
            const encodedUrl = urlObj.toString();
            if (navigator.share) {
                // Share URL only — WeChat fetches link preview (title/desc/image) automatically
                // title param is for OS share sheet only, not sent to WeChat
                navigator.share({ title: title, url: encodedUrl }).catch(() => {});
            } else {
                // Fallback: copy "title + URL" so user knows what it is
                copyToClipboard(title + '\n' + encodedUrl, '✅ 已复制: ' + title);
            }
        }
        // Copy clean (decoded) URL to clipboard
        function copyUrl(relativeHref) {
            const a = document.createElement('a');
            // Normalize: deployed site serves .html only; .md links 404/400
            if (/\.md(\?|#|$)/.test(relativeHref)) {
                relativeHref = relativeHref.replace(/\.md(\?|#|$)/, '.html$1');
            }
            a.href = relativeHref;
            const fullUrl = a.href;
            // 2026-08-15 用户要求：复制出来必须是可读汉字URL。
            // 注意：URL API 的 pathname setter 会自动 re-encode（URL标准行为），
            // 所以必须绕过 URL API 直接字符串拼接。
            // 浏览器/飞书/微信粘贴裸汉字URL时会自动percent-encode再发请求，实测可正常打开。
            let cleanUrl;
            try {
                const u = new URL(fullUrl);
                cleanUrl = u.origin + decodeURIComponent(u.pathname) + u.search;
            } catch (e) { cleanUrl = fullUrl; }
            copyToClipboard(cleanUrl, '✅ 已复制: ' + decodeURIComponent(cleanUrl.split('/').pop()));
        }
        function copyToClipboard(text, toastMsg) {
            navigator.clipboard.writeText(text).then(() => {
                showToast(toastMsg);
            }).catch(() => {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                showToast(toastMsg);
            });
        }
        function showToast(msg) {
            let t = document.getElementById('copy-toast');
            if (!t) { t = document.createElement('div'); t.id = 'copy-toast'; t.className = 'toast'; document.body.appendChild(t); }
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 2000);
        }
    </script>
</body>

</html>
