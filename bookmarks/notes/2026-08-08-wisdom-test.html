        body {

            background-clip: text;

        h1::after {
            content: '';
            display: block;
            width: 60px;
            height: 3px;
            margin-top: 14px;
            border-radius: 2px;
            background: linear-gradient(90deg, #7c5cbf, #b892d6, transparent);

            position: relative;
            padding-left: 16px;
            border-bottom: none;
        }
        h2::before {
            content: '';
            position: absolute;
            left: 0;
            top: 4px;
            bottom: 4px;
            width: 4px;
            border-radius: 2px;
            background: linear-gradient(180deg, #7c5cbf, #b892d6);
        }

        blockquote {
            font-style: italic;
            position: relative;
            background: linear-gradient(135deg, #f5f0ff 0%, #fdf8f4 100%);
            border-radius: 0 8px 8px 0;
        }
        blockquote::before {
            content: '"';
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 3em;
            color: #b892d6;
            line-height: 0;
            vertical-align: -0.35em;
            margin-right: 6px;
            opacity: 0.6;
        }

        strong {
            color: #7c5cbf;
            font-weight: 600;
        }

        hr {
            height: 2px;
            background: linear-gradient(90deg, transparent, #7c5cbf30, #b892d630, transparent);
        }

        ::selection {
            background: #b892d640;
        }
